<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2347"/>
      <stop offset="55%" stop-color="#2E2250"/>
      <stop offset="100%" stop-color="#5C3A55"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7E7B6"/>
      <stop offset="100%" stop-color="#F2C14E"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#F2C14E">
    <circle cx="70" cy="80" r="4"/>
    <circle cx="140" cy="50" r="3"/>
    <circle cx="230" cy="90" r="3.5"/>
    <circle cx="370" cy="60" r="4"/>
    <circle cx="430" cy="110" r="3"/>
    <circle cx="60" cy="150" r="2.5"/>
    <circle cx="330" cy="40" r="2.5"/>
  </g>

  <!-- lua -->
  <circle cx="365" cy="130" r="54" fill="url(#moonGlow)"/>
  <g fill="#E8A93C" opacity="0.35">
    <circle cx="348" cy="112" r="8"/>
    <circle cx="382" cy="146" r="11"/>
    <circle cx="388" cy="108" r="5"/>
  </g>

  <!-- montanhas -->
  <path d="M0,330 L60,290 L110,315 L160,255 L195,280 L230,205 L265,230 L300,170 L335,215 L380,195 L430,300 L512,260 L512,512 L0,512 Z" fill="#5C3A55" opacity="0.75"/>
  <path d="M0,370 L70,330 L130,360 L190,310 L250,350 L320,320 L390,365 L460,335 L512,370 L512,512 L0,512 Z" fill="#3A2440"/>

  <!-- vulcão com neve -->
  <path d="M190,310 L256,185 L322,310 Z" fill="#B5432A"/>
  <path d="M256,185 L229,235 L283,235 Z" fill="#FBF4E7"/>

  <!-- cacto -->
  <g fill="#4F7C5A">
    <rect x="96" y="360" width="20" height="90" rx="10"/>
    <rect x="66" y="390" width="20" height="45" rx="10"/>
    <rect x="126" y="378" width="20" height="58" rx="10"/>
  </g>
